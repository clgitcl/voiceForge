
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: voiceforge
      POSTGRES_PASSWORD: voiceforge123
      POSTGRES_DB: voiceforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - voiceforge-network

  livekit:
    image: livekit/livekit-server:latest
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    environment:
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=voiceforge-dev-secret-2026-abcdefghijklmnopqrstuvwxyz
      - LIVEKIT_REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    volumes:
      - ./infrastructure/livekit/livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    networks:
      - voiceforge-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - voiceforge-network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=tinyllama
    volumes:
      - ollama_data:/root/.ollama
      - ./infrastructure/ollama/Modelfile:/Modelfile
    networks:
      - voiceforge-network
    command: serve

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://voiceforge:voiceforge123@postgres:5432/voiceforge
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=voiceforge-dev-secret-2026-abcdefghijklmnopqrstuvwxyz
      - LIVEKIT_URL=http://livekit:7880
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - postgres
      - livekit
      - redis
      - ollama
    networks:
      - voiceforge-network

  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile
    environment:
      - API_URL=http://api:3001
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=voiceforge-dev-secret-2026-abcdefghijklmnopqrstuvwxyz
      - OLLAMA_URL=http://ollama:11434



    depends_on:
      - redis
    networks:
      - voiceforge-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3777:3000"
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_LIVEKIT_URL=ws://localhost:7880
    depends_on:
      - api
    networks:
      - voiceforge-network

networks:
  voiceforge-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:



